project_id = "historia-clinica-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

# The app migrator owns its transaction/checksum registry in private.app_migrations.
[db.migrations]
enabled = false

[db.seed]
enabled = false

[db.pooler]
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/recuperar", "http://localhost:5173/mis-turnos", "http://127.0.0.1:5173/recuperar", "http://127.0.0.1:5173/mis-turnos"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true
secure_password_change = true

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
